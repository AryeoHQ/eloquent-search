# Tests aryeo/eloquent-search and publishes it to the Artifactory Composer repository.
#
# Branches run the tests and the code style, static analysis and dependency checks.
# Releases come from main: after the checks pass, the release job reads the merge request
# titles since the last tag and pushes the next tag (fix: patch, feat: minor, feat!: or fix!:
# major, chore: none). The tag pipeline then runs the same checks, packages the tagged source
# and publishes it. To republish a tag whose pipeline failed, run a new pipeline on that tag.
#
# The job scripts come from the shared template.
include:
  - project: vendor-platform/ci_cd/gitlab-ci-templates
    ref: main
    file: php-composer-package.yml

stages:
  - test
  - release
  - package
  - publish

default:
  tags:
    - build
  interruptible: true

# Merge requests run as merge request pipelines; the only branch pipelines are on the default
# branch, where the release job runs. Tags run the publish jobs.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

tests:
  stage: test
  extends: .php-tests
  variables:
    TEST_COMMAND: ./vendor/bin/paratest
  parallel:
    matrix:
      - COMPOSER_REQUIRE: "laravel/framework:12.* orchestra/testbench:10.*"
      - COMPOSER_REQUIRE: "laravel/framework:13.* orchestra/testbench:11.*"

code-style:
  stage: test
  extends: .php-code-style

static-analysis:
  stage: test
  extends: .php-static-analysis

dependency-analysis:
  stage: test
  extends: .php-dependency-analysis

# Runs only on main, so merge requests and other branches never tag. RELEASE_TOKEN comes from
# the vendor-platform group and is protected, which is why only main gets it.
release:
  stage: release
  extends: .release
  needs: [tests, code-style, static-analysis, dependency-analysis]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

package:
  stage: package
  extends: .package
  needs: [tests, code-style, static-analysis, dependency-analysis]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/

publish:
  stage: publish
  extends: .publish
  needs: [package]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
